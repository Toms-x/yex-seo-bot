version: "3.8"

services:
  # ============================================================
  # n8n - handles scheduling, fetching, Telegram delivery
  # ============================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      # Basic auth so your n8n UI isn't wide open on the internet.
      # Set these in .env - see .env.n8n.example
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - intelligence

  # ============================================================
  # Python intelligence microservice - Claude interpretation + dedup
  # ============================================================
  intelligence:
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  n8n_data:
